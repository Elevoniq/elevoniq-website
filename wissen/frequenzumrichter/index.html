<!-- GA4 — nur nach Analytics-Consent -->
<script>
(function() {
  function loadGA4() {
    var s = document.createElement('script');
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-RPSDHVCT33';
    s.async = true;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-RPSDHVCT33');
  }
  /* cookie-consent.js laeuft mit defer, dieses Inline-Skript dagegen sofort beim
     Parsen. window.elevoniqConsent existiert hier also noch nicht. Deshalb erst
     nach DOMContentLoaded registrieren: deferred Skripte sind dann ausgefuehrt.
     Ohne diesen Nachlauf wuerde GA4 nie geladen, auch nicht mit Consent. */
  function registerConsentHook() {
    if (window.elevoniqConsent) {
      window.elevoniqConsent.onAnalyticsAccepted(loadGA4);
    }
  }
  if (window.elevoniqConsent) {
    registerConsentHook();
  } else {
    document.addEventListener('DOMContentLoaded', registerConsentHook);
  }
})();
</script>
</body>
